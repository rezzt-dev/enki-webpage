# CI de la landing (docs/roadmap/08-testing-qa.md §5):
# lint → format → check → build → html → SEO/peso → audit → E2E (3 motores) → visual → axe → Lighthouse → enlaces.
#
# Push a una rama de trabajo: solo Chromium, SEO y axe. PR hacia main y push a main: matriz completa, con
# Firefox, WebKit y regresión visual (08 §6: tiempo de CI).
name: web

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · check · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      playwright: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:html
      - name: SEO y presupuestos de peso sobre dist/
        run: |
          node scripts/check-seo.mjs
          node scripts/check-performance-budgets.mjs
      - name: Dependencias de producción sin vulnerabilidades altas ni críticas
        run: pnpm audit --prod --audit-level high
      - id: playwright
        name: Versión de Playwright (fija la imagen de los tests)
        run: echo "version=$(node -p 'JSON.parse(require("fs").readFileSync("node_modules/@playwright/test/package.json")).version')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: playwright · ${{ matrix.project }}
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # La misma imagen que `pnpm test:docker`: las capturas de referencia coinciden píxel a píxel.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.quality.outputs.playwright }}-noble
      options: --ipc=host
    env:
      # Firefox exige que HOME pertenezca al usuario del contenedor.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON((github.event_name != 'push' || github.ref == 'refs/heads/main') && '["chromium","firefox","webkit","static","a11y","visual"]' || '["chromium","static","a11y"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright test --project="${{ matrix.project }}*"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm lighthouse

  links:
    name: enlaces (lychee)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: pnpm check:links
